name: Deploy staging
on:
  push:
    branches: [main, 'cms/**']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: royal-duck-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOYMENTS_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Deploy staging website
        id: deploy
        run: node scripts/deploy.mjs staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save an immutable preview for this change
        id: preview
        run: node scripts/preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Attach preview link to CMS draft
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=staging-preview \
            -f description='Staging preview is ready for review' \
            -f target_url="$PREVIEW_URL"
          printf 'Preview: %s\n\nCommit: %s\n' "$PREVIEW_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
