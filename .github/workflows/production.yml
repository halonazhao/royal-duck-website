name: Publish production (Halona only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: royal-duck-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'halonazhao' && github.triggering_actor == 'halonazhao' && vars.DEPLOYMENTS_ENABLED == 'true'
    environment:
      name: production
      url: https://www.royalduckusa.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Publish approved release
        run: node scripts/deploy.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_APPROVED: 'true'
